[Service]
EnvironmentFile=%h/.config/environment.d/openclaw.conf
# Keep EDA vendor libraries private to OpenClaw and its child processes.
# Exporting them through environment.d breaks GTK applications system-wide
# because VCS ships an older libsqlite3.so.0.
Environment=LD_LIBRARY_PATH=/opt/cuda/lib64:/opt/synopsys/vcs/W-2024.09-SP1/linux64/lib:/opt/synopsys/verdi/W-2024.09-SP1/share/PLI/VCS/linux64
